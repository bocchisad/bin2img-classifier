name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train demo model
        run: |
          mkdir -p artifacts
          python scripts/train.py --per-class 20 --iterations 40 --out artifacts/model.cbm

      - name: Run tests
        run: pytest -q
        env:
          BIN2IMG_DB: artifacts/ci_test.db
